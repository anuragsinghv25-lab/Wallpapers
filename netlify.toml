[build]
  command = "npm run build"
  publish = "dist"

[build.environment]
  NODE_VERSION = "22"

# --- Security headers -------------------------------------------------------
[[headers]]
  for = "/*"
  [headers.values]
    X-Content-Type-Options = "nosniff"
    Referrer-Policy = "strict-origin-when-cross-origin"
    X-Frame-Options = "SAMEORIGIN"
    Permissions-Policy = "camera=(), microphone=(), geolocation=()"

# --- Caching ----------------------------------------------------------------
# Astro's own bundles are content-hashed.
[[headers]]
  for = "/_astro/*"
  [headers.values]
    Cache-Control = "public, max-age=31536000, immutable"

# Generated gallery derivatives have a content hash in the file name,
# so they can be cached forever; replacing a source image changes the name.
[[headers]]
  for = "/generated/*"
  [headers.values]
    Cache-Control = "public, max-age=31536000, immutable"

# Original wallpaper files keep fixed names, so use a moderate cache
# so a corrected image shows up within a week.
[[headers]]
  for = "/wallpapers/*"
  [headers.values]
    Cache-Control = "public, max-age=604800, stale-while-revalidate=86400"
